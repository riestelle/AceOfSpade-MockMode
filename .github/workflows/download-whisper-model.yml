name: Download Whisper Model

# Run manually via the GitHub UI, or trigger automatically when the model
# directory placeholder is the only change on the default branch.
on:
  workflow_dispatch:
    inputs:
      force_redownload:
        description: 'Re-download even if files already exist'
        required: false
        default: 'false'
        type: boolean

jobs:
  download-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if model files already exist
        id: check
        run: |
          ENCODER="assets/js/session-interview/models/Xenova/whisper-tiny.en/onnx/encoder_model_quantized.onnx"
          DECODER="assets/js/session-interview/models/Xenova/whisper-tiny.en/onnx/decoder_model_merged_quantized.onnx"
          if [ -f "$ENCODER" ] && [ -f "$DECODER" ] && [ "${{ inputs.force_redownload }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Model files already present — skipping download."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Xenova/whisper-tiny.en model files
        if: steps.check.outputs.skip != 'true'
        run: |
          BASE="https://huggingface.co/Xenova/whisper-tiny.en/resolve/main"
          DEST="assets/js/session-interview/models/Xenova/whisper-tiny.en"
          mkdir -p "$DEST/onnx"

          echo "Downloading config and tokenizer files..."
          for FILE in \
            config.json \
            generation_config.json \
            tokenizer.json \
            tokenizer_config.json \
            preprocessor_config.json; do
            echo "  $FILE"
            curl -fsSL "$BASE/$FILE" -o "$DEST/$FILE"
          done

          echo "Downloading quantized ONNX model files..."
          for FILE in \
            onnx/encoder_model_quantized.onnx \
            onnx/decoder_model_merged_quantized.onnx; do
            echo "  $FILE"
            curl -fsSL "$BASE/$FILE" -o "$DEST/$FILE"
          done

          echo ""
          echo "Download complete. File sizes:"
          du -sh "$DEST"/*.json "$DEST"/onnx/*.onnx

      - name: Remove placeholder .gitkeep if present
        if: steps.check.outputs.skip != 'true'
        run: |
          KEEP="assets/js/session-interview/models/Xenova/whisper-tiny.en/onnx/.gitkeep"
          if [ -f "$KEEP" ]; then
            rm "$KEEP"
            echo "Removed .gitkeep placeholder."
          fi

      - name: Commit and push model files
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/session-interview/models/Xenova/
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Nothing to commit — model files unchanged."
          else
            git commit -m "chore: bundle Xenova/whisper-tiny.en quantized model for local serving"
            git push
          fi
